<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartographer — Free & Open-Source D&D Map Maker</title>
    <meta name="description" content="Free, open-source tabletop RPG map creator inspired by Dungeon Scrawl. Draw dungeon maps, rivers, foliage, and export to Universal VTT, PNG, and print-ready PDF." />
    <script>
      // Apply the saved UI theme before first paint (see src/core/preferences.ts)
      (function () {
        var d = document.documentElement, p = {};
        try { p = JSON.parse(localStorage.getItem('cartographer.preferences.v1')) || {}; } catch (e) {}
        var t = p.uiTheme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.uiTheme = t;
        d.dataset.accent = p.accent || 'blue';
        d.dataset.uiSize = p.uiSize || 'normal';
      })();
    </script>
    <!-- Serif face for map labels; the app chrome uses the system font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
